<!DOCTYPE html>
<html>

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="/static/css/create-post.css"> 
        <title>Create POST</title> 
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">  
    </head>
    <body>

        <nav class="navbar navbar-light bg-light px-3">
            <a class="navbar-brand" href="/">Blog Platform</a>
            <div class="ms-auto">
                <a href="/" class="nav-link d-inline text-dark">Home</a>
            </div>
        </nav>

        <div class="container mt-4"style="max-width:40rem;">
            <h3 class="mb-3">Create New Post</h3>

            <form id="create-post-form">
                <div class="mb-3">
                    <label for="title" class="form-label">Enter your title</label>
                    <input id="title" class=form-control type="text" placeholder="title" required> 
                </div>

                <div class="mb-3">
                    <label for="content" class="form-label">Content</label>
                    <textarea id="content" class=form-control placeholder="content"  rows="6" required></textarea> 
                </div>

                <button class="btn btn-primary w-100" type="submit">Create post</button>

                <p id="error" class="text-danger mt-3 text-center"></p>

            </form>

        </div>

        <script src="/static/script/create-post.js"></script>
    </body>

</html>
