<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Blog Platform</title>
        <link rel="stylesheet" href="/static/css/register.css">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">  
    </head>
    <body>
        <nav class="navbar navbar-light bg-light px-3">
            <a class="navbar-brand" href="/">Blog Platform</a>
            <div class="ms-auto">
                <a href="/" class="nav-link d-inline text-dark">Home</a>
            </div>
        </nav>

        <div class="container vh-100 justify-content-center align-items-center d-flex">

            <div class="card shadow" style="width: 35rem;">

                <div class="card-body">
                    <h3 class="text-center">Register</h3>
                    <form id="register-form">
                        <div class="mb-3">
                        <label for="username" class="form-label">Username</label>
                        <input class="form-control" id="username" type="text" placeholder="Choose your username" required>
                        </div>
                        <div class="mb-3">
                            <label for="email" class="form-label">Email</label>
                            <input class="form-control" id="email" type="email" placeholder="Enter your email" required>
                        </div>
                        <div class="mb-3">
                            <label for="password" class="form-label">Password</label>
                            <input class="form-control" id="password" type="password" placeholder="*******" required>
                        </div>

                        <button type="submit" class="btn btn-primary w-100">Register</button>

                    </form>
                
                    <p  id="error" class="text-danger text-center mt-3"></p>

                    <p class="text-center mt-3">
                        Already have an account?
                        <a href="/login">Login here</a>
                    </p>
                     
                </div>

            </div>

        </div>

        <footer class="bg-light text-center text-muted py-3 mt-5 border-top">
            <small>
                © 2026 Blog Platform ·
                <br>
                <a href="#" class="text-muted text-decoration-none">Instagram</a>
                <a href="#" class="text-muted text-decoration-none">Telegram</a>
            </small>
        </footer>

        <script src="/static/script/auth.js"></script>
    </body>
</html>
