<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Blog Platform</title>
        <link rel="stylesheet" href="/static/css/login.css">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">  
    </head>
    <body>
        <nav class="navbar navbar-light bg-light px-3">
            <a class="navbar-brand" href="/">Blog Platform</a>
            <div class="ms-auto">
                <a href="/" class="nav-link d-inline text-dark">Home</a>
            </div>
        </nav>

        <div class="container vh-100 d-flex justify-content-center align-items-center">
          
                <div class="card shadow card-shadow " style="width: 35rem;">
                    
                    <div class="card-body">
                        <h3 class="text-center mb-4">Login</h3>
                        <form id="login-form">
                            <div class="mb-3">
                            <label class="form-label" for="email">Email</label>
                            <input id="email" type="email" class="form-control" placeholder="Email" required>
                            </div>

                            <div class="mb-3">
                                <label class="form-label" for="password">Password</label>
                                <input id="password" type="password" class="form-control" placeholder="*******" required>
                            </div>

                            <button type="submit" class="btn btn-primary w-100">Login</button>
                        </form>
                        
                        <p id="error" class="text-danger text-center mt-3"></p>

                        <p class="text-center mt-3">Don't have an account?
                            <a href="/register">Register</a>
                        </p>

                    </div>

            </div>
        </div>

        <footer class="bg-light text-center text-muted py-3 mt-5 border-top">
            <small>
                © 2026 Blog Platform ·
                <br>
                <a href="#" class="text-muted text-decoration-none">Instagram</a>
                <a href="#" class="text-muted text-decoration-none">Telegram</a>
            </small>
        </footer>

        <script src="/static/script/auth.js"></script>
    </body>
</html>
